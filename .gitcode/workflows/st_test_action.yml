name: A5_smoke

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string

env:
  run_package_name: "cann-ops-nn-custom_linux-x86_64_950.run"

jobs:
  A5_smoke:
    name: PreSmoke_A5
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/compile.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: check_pr_whitelist
        identifier: check_whitelist
        run: |
          set -euo pipefail
          cd ${{ steps.process_checkout.outputs.path }}
          result=$(bash scripts/ci/ops_st_test.sh --ci_st_check --pr_filelist=./pr_filelist.txt)
          echo "in_whitelist=${result##*=}" >> "$ATOMGIT_OUTPUT"
      -
        name: download_compiled_package
        if: ${{ steps.check_whitelist.outputs.in_whitelist == 'yes' }}
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/${{ env.run_package_name }}
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: check_950_package_content
        identifier: check_950_pkg
        if: ${{ steps.check_whitelist.outputs.in_whitelist == 'yes' }}
        run: |
          pkg="${{ steps.process_checkout.outputs.path }}/${{ env.run_package_name }}"
          if [[ -f "${pkg}" && $(stat -c%s "${pkg}") -gt 0 ]]; then
            echo "need_st=yes" >> "$ATOMGIT_OUTPUT"
          else
            echo "need_st=no" >> "$ATOMGIT_OUTPUT"
            echo "Skip st_950: compiled package not found or empty: ${pkg}"
          fi
      -
        name: install_run_package
        if: ${{ steps.check_950_pkg.outputs.need_st == 'yes' }}
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          echo "Installing compiled package: ${{ env.run_package_name }}"
          chmod +x "${{ env.run_package_name }}"
          source /usr/local/Ascend/cann/bin/setenv.bash 2>/dev/null || true
          if bash "${{ env.run_package_name }}" --help 2>&1 | grep -q -- '--full'; then
            full_arg="--full"
          else
            full_arg=""
          fi
          echo 'y' | bash "${{ env.run_package_name }}" $full_arg --quiet
      -
        name: run_st_test
        identifier: st_test
        if: ${{ steps.check_950_pkg.outputs.need_st == 'yes' }}
        timeout-minutes: 60
        env:
          CI_ONLINE_MODE: "1"
        run: |
          export WORKSPACE=${{ steps.process_checkout.outputs.path }}
          cd ${{ steps.process_checkout.outputs.path }}
          source /usr/local/Ascend/cann/bin/setenv.bash 2>/dev/null || true
          pip3 install psutil openpyxl en-dtypes
          bash scripts/ci/ops_st_test.sh --pr_filelist=./pr_filelist.txt --soc_version=ascend950
      -
        name: package_st_results
        if: ${{ always() && steps.check_950_pkg.outputs.need_st == 'yes' }}
        run: |
          cd ${{ steps.process_checkout.outputs.path }}
          rm -f st_950_log.tar.gz
          if [[ -d st ]]; then
            tar -zcf st_950_log.tar.gz st
          else
            echo "WARN: st result dir not found, skip packaging"
          fi
      -
        name: upload_results
        if: ${{ always() && steps.check_950_pkg.outputs.need_st == 'yes' }}
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/st_950_log.tar.gz
          object-prefix: ${{ env.obs_path }}/st_results/cann
    if: "${{ default() }}"
    runs-on: ['self-hosted', 'npu=1','smoke=501']
    container:
      image: swr.cn-north-4.myhuaweicloud.com/pre_smoke/ubuntu24.04_x86:pre_mindspore_A5_conda_v1.1001

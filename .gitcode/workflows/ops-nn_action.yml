name: PR-pipeline_ops-nn

concurrency:
    max: 15
    exceed-action: QUEUE
    enable: true
    preemption:
      enable: true
      events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^/?compile(@[A-Za-z0-9._-]+)?$' ]
  pr_comment:
      types: [ created ]
      keyword: '^/?compile(@[A-Za-z0-9._-]+)?$'

env:
  org_name: "${{ vars.ORG_NAME }}"
  repo_name: ${{atomgit.event.repository.name}}
  MERGE_ID: ${{atomgit.event.pull_request.number}}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  TARGET_BRANCH: ${{atomgit.ref_name}}
  SOURCE_BRANCH: ${{atomgit.head_ref}}
  obs_smoke_path: "${{ env.obs_path }}/presmoke/2"
  online: ${{ vars.APPLY_LABEL }}
  run_package_name: "cann-ops-nn-custom_linux-x86_64_950.run"

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: "ops-nn"
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
          -
            name: show_output
            run: |
              echo "image: ${{ steps.revise_image.outputs.Compile_Ascend_X86  }}"
        if: "${{ default() }}"
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
      JOB_pre:
        permissions:
          repository: read
          id-token: write
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    jobs:
      JOB_check_example:
        permissions:
          repository: read
          id-token: write
        name: Check_Example
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Check_Example'
          arch: 'x64'
          size: 'small'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
        if: env.TARGET_BRANCH == 'master'
      JOB_codecheck:
        permissions:
          repository: read
          id-token: write
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_x86_compile:
        permissions:
          repository: read
          id-token: write
        name: Compile_X86
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'x86_compile'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn_linux-x86_64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86 }}
      JOB_x86_compile_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_X86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'x86_compile_ubuntu24'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn_linux-x86_64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24 }}
      JOB_X86_monitor_910b:
        permissions:
          repository: read
          id-token: write
        name: Compile_X86_monitor_910b
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'X86_monitor_910b'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn-monitor-910b_linux-x86_64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_monitor }}
      JOB_X86_monitor_910c:
        permissions:
          repository: read
          id-token: write
        name: Compile_X86_monitor_910c
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'X86_monitor_910c'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn-monitor-910c_linux-x86_64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_monitor }}
      JOB_X86_monitor_950:
        permissions:
          repository: read
          id-token: write
        name: Compile_X86_monitor_950
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'X86_monitor_950'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn-monitor-950_linux-x86_64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_X86_monitor_9_0_0 }}
      JOB_Compile_Ascend_X86_950_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_X86_950_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_950_ubuntu24'
          arch: 'x64'
          size: 'xlarge'
          package_name: 'cann-ops-nn-custom_linux-x86_64_950_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_950_ubuntu24 }}
      JOB_Compile_Ascend_X86_mobile_station:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_X86_mobile_station
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_mobile_station'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn-kirinx90_linux-x86_64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_mobile_station }}
      JOB_Compile_Ascend_X86_mobile_station_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_X86_mobile_station_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_mobile_station_ubuntu24'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn-kirinx90_linux-x86_64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_mobile_station_ubuntu24 }}
      JOB_Compile_Ascend_X86_950:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_X86_950
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_950'
          arch: 'x64'
          size: 'xlarge'
          package_name: 'cann-ops-nn-custom_linux-x86_64_950.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_950 }}
      JOB_Pre_compile:
        permissions:
          repository: read
          id-token: write
        name: Compile_Pre
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Pre_compile'
          arch: 'arm64'
          size: 'xlarge'
          package_name: 'cann-ops-nn-fatrelu_mul_linux-aarch64.run'
          image_version: ${{ jobs.JOB_image.outputs.Pre_Compile }}
      JOB_compile_single:
        permissions:
          repository: read
          id-token: write
        name: Compile_single
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'compile_single'
          arch: 'arm64'
          size: 'xlarge'
          package_name: 'single.tar.gz'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_single }}
      JOB_arm_compile:
        permissions:
          repository: read
          id-token: write
        name: Compile_arm
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'arm_compile'
          arch: 'arm64'
          size: 'xlarge'
          package_name: 'cann-ops-nn_linux-aarch64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM }}
      JOB_arm_compile_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_arm_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'arm_compile_ubuntu24'
          arch: 'arm64'
          size: 'xlarge'
          package_name: 'cann-ops-nn_linux-aarch64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}
      JOB_compile_single_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_single_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'compile_single_ubuntu24'
          arch: 'arm64'
          size: 'xlarge'
          package_name: 'single_ubuntu24.tar.gz'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_single_ubuntu24 }}
      JOB_Compile_Ascend_experimental:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_experimental
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_experimental'
          arch: 'arm64'
          size: 'large'
          package_name: 'cann-ops-nn-experimental_linux-aarch64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_experimental }}
      JOB_Compile_Ascend_experimental_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_experimental_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_experimental_ubuntu24'
          arch: 'arm64'
          size: 'large'
          package_name: 'cann-ops-nn-experimental_linux-aarch64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_experimental_ubuntu24 }}
      JOB_Compile_Ascend_ARM_950_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_ARM_950_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_950_ubuntu24'
          arch: 'arm64'
          size: 'xlarge'
          package_name: 'cann-ops-nn-950_linux-aarch64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_950_ubuntu24 }}
      JOB_Compile_Ascend_ARM_950:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_ARM_950
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_950'
          arch: 'arm64'
          size: 'xlarge'
          package_name: 'cann-ops-nn-950_linux-aarch64.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_950 }}
      JOB_Compile_Ascend_X86_mobile_station_9030_ubuntu24:
        permissions:
          repository: read
          id-token: write
        name: Compile_Ascend_X86_mobile_station_9030_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_mobile_station_9030_ubuntu24'
          arch: 'x64'
          size: 'large'
          package_name: 'cann-ops-nn-kirin9030_linux-x86_64_ubuntu24.run'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_mobile_station_ubuntu24 }}
      JOB_staticcheck_md_check:
        permissions:
          repository: read
          id-token: write
        name: staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: true
  stage3:
    name: UT
    jobs:
      JOB_api_check:
        name: API_Check
        steps:
          -
            name: api-check
            identifier: api-check
            uses: cann/.gitcode/actions/api-check@master
            with:
              org_name: ${{ env.org_name }}
              mode: check
              repo_name: ${{ env.repo_name }}
              merge_id: ${{ env.MERGE_ID }}
        if: env.TARGET_BRANCH == 'master'
        runs-on: ["self-hosted", "arch=x64", "spec=small"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.API_Check }}
      JOB_UT_Test_ophost:
        permissions:
          repository: read
          id-token: write
        name: UT_Test_ophost
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'ophost'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_ophost }}
      JOB_UT_Test_opapi:
        permissions:
          repository: read
          id-token: write
        name: UT_Test_opapi
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'opapi'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_opapi }}
      JOB_UT_Test_kernel:
        permissions:
          repository: read
          id-token: write
        name: UT_Test_kernel
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'opkernel'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_kernel }}
      JOB_UT_Test_opgraph:
        permissions:
          repository: read
          id-token: write
        name: UT_Test_opgraph
        uses: .gitcode/workflows/ut_action.yml
        with:
          ut_type: 'opgraph'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_opgraph }}
    pre:
    - type: auto
    fail-fast: true
  stage4:
    name: UT_report
    select: selected_by_default
    jobs:
      JOB_ut_report:
        permissions:
          repository: read
          id-token: write
        name: ut_report
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: oidc_auth
            uses: huaweicloud-oidc-auth
            with:
              audience: ${{ secrets.audience }}
              agency_urn: ${{ secrets.agency_urn }}
              provider_urn: ${{ secrets.provider_urn }}
              region: cn-north-4
              duration: 3600
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: ut_report
            identifier: ut-report
            uses: cann/.gitcode/actions/ut-cov-report@master
            with:
              workspace: ${{ steps.process_checkout.outputs.path }}
              token: ${{ secrets.TESTTOKEN }}
              cov_mode: "report"
              ut_field: "ops-nn"
              ut_type: "ops-nn"
              modules: "ophost opapi opkernel opgraph"
              source_branch: ${{ env.SOURCE_BRANCH }}
              target_branch: ${{ env.TARGET_BRANCH }}
              obs_path: ${{ env.obs_path }}
              git_token: ${{ secrets.GIT_TOKEN }}
              UT_SOFT_FAIL_REPOS: ${{ vars.UT_SOFT_FAIL_REPOS }}
          -
            name: upload
            uses: obs-upload
            if: ${{ always() }}
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              artifact-path: |
                ${{ steps.process_checkout.outputs.path }}/ut_cov_*.tar.gz
              object-prefix: ${{ env.obs_path }}/
        if: env.TARGET_BRANCH == 'master'
        runs-on: ["self-hosted", "arch=x64", "spec=medium"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.UT_Test_ophost }}
    pre:
    - type: auto
    fail-fast: true
  stage5:
    name: PreSmoke
    jobs:
      A2_smoke:
        permissions:
          repository: read
          id-token: write
        name: PreSmoke_A2
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          -
            name: oidc_auth
            uses: huaweicloud-oidc-auth
            with:
              audience: ${{ secrets.audience }}
              agency_urn: ${{ secrets.agency_urn }}
              provider_urn: ${{ secrets.provider_urn }}
              region: cn-north-4
              duration: 3600
          -
            name: download
            uses: obs-download
            if: ${{ always() }}
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke executor
            timeout-minutes: 30
            run: |
                set -e
                # set env
                export WORKSPACE=${{ steps.process_checkout.outputs.path }}
                export single_tar_url=${{jobs.JOB_compile_single.outputs.arm_run_url}}
                export experimental_run_url=${{jobs.JOB_Compile_Ascend_experimental_ubuntu24.outputs.arm_run_url}}
                export fatrelu_run_url=${{jobs.JOB_Pre_compile.outputs.arm_run_url}}
                export repo_name=${{env.repo_name}}
                export pr_id=${{ env.MERGE_ID }}
                bash ${{ steps.process_checkout.outputs.path }}/pre_smoke.sh
          - name: upload
            if: ${{ always() }}
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog*.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/
        if: env.TARGET_BRANCH == 'master'
        runs-on: ['self-hosted','npu=1','smoke=204']
        container:
          image: swr.cn-south-1.myhuaweicloud.com/pre_smoke/${{ jobs.JOB_image.outputs.PreSmoke_A900 }}
      A5_smoke:
        permissions:
          repository: read
          id-token: write
        name: PreSmoke_A5
        uses: .gitcode/workflows/st_test_action.yml
        if: env.TARGET_BRANCH == 'master'
        with:
          task_name: 'opkernel'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_kernel }}
      PreSmoke_harmony-infer-chs-nn:
        permissions:
          repository: read
          id-token: write
        name: PreSmoke_harmony-infer-chs-nn
        uses: .gitcode/workflows/kirin_pre_smoke_action.yml
        with:
          repo_name: 'ops-nn'
          device_type: 'chs_phone'
          rdv_script: 'rdv_kirin9030_gitcode.sh'
          chip_version: 'Kirin9030'
          cases_pool: 'nn_all.json'
          cases_baseline: 'nn.json'
      PreSmoke_harmony-infer-cpro-nn:
        permissions:
          repository: read
          id-token: write
        name: PreSmoke_harmony-infer-cpro-nn
        uses: .gitcode/workflows/kirin_pre_smoke_action.yml
        with:
          repo_name: 'ops-nn'
          device_type: 'kirinx90'
          rdv_script: 'rdv_kirinx90_gitcode.sh'
          chip_version: 'KirinX90'
          cases_pool: 'nn_all.json'
          cases_baseline: 'nn.json'
    pre:
    - type: auto
    fail-fast: true

post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
